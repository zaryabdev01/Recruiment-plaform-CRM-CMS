# Netlify deploy config for the Internal Console prototype (Vite + React Router).
#
# The whole console (CMS + CRM + Recruiter portal) runs on in-memory sample
# data — no backend, no API calls leave the browser. `npm run build` produces
# a fully static site in `dist/`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every unknown path serves index.html so client-side routing
# (e.g. a hard refresh on /crm/relationships) doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
